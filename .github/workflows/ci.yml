name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "journels/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "journels/**"
      - "**.md"
  workflow_dispatch:
  workflow_call: # release.yml runs all these checks first

permissions:
  contents: read

# a new push stops the older run that is still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ide:
    name: IDE (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      # same result on every OS, so only once
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Lint
        if: runner.os == 'Linux'
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build and run tests
        run: cargo test --locked

  web:
    name: Web UI
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check every JS file
        run: |
          for f in app/web/js/*.js; do
            echo "checking $f"
            node --check "$f"
          done

      - name: Tests (files, languages, AI autocomplete)
        run: node --test app/tests/web.test.js

  foxai:
    name: FoxAi
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: FoxAi
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: FoxAi

      - name: Check that it compiles
        run: cargo check --locked