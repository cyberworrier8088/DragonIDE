<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DragonFoxIDE</title>

    <link rel="stylesheet" href="css/main.css">

    <link rel="stylesheet" href="css/titlebar.css">

    <link rel="stylesheet" href="css/settings.css">

    <link id="highlight-theme" rel="stylesheet" href="css/themes/dark.css">

</head>

<body>

    <!-- Custom title bar-->
    <div id="titlebar">

        <div id="titlebar-content">
            <div id="titlebar-left" data-tauri-drag-region>
                <span id="app-title">DragonFoxIDE</span>
            </div>

            <div id="titlebar-center" data-tauri-drag-region>

            </div>

            <div id="titlebar-right">
                <button id="minimize-btn" class="titlebar-button" title="Minimize">
                    <svg width="16" height="16" viewBox="0 0 16 16">
                        <path fill="currentColor" d="M14 8v1H2V8z" />
                    </svg>
                </button>

                <button id="maximize-btn" class="titlebar-button" title="Maximize">
                    <svg width="16" height="16" viewBox="0 0 16 16">
                        <path fill="currentColor" d="M3 3v10h10V3H3zm9 9H4V4h8v8z" />
                    </svg>
                </button>

                <button id="close-btn" class="titlebar-button" title="Close">
                    <svg width="16" height="16" viewBox="0 0 16 16">
                        <path fill="currentColor"
                            d="M2.3 1.3l1.4-1.4L8 6.6l4.3-4.3 1.4 1.4L9.4 8l4.3 4.3-1.4 1.4L8 9.4l-4.3 4.3-1.4-1.4L6.6 8 2.3 3.7z" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <div id="app">

        <aside id="activity-bar">
            <button class="activity-button active">EX</button>
            <button class="activity-button">SR</button>
            <button class="activity-button">GI</button>
            <button class="activity-button">DB</button>

            <div class="activity-spacer"></div>

            <button class="activity-button" id="settings-button"><img src="assets/icon/setting.svg"
                    alt="setting"></button>
        </aside>

        <aside id="sidebar">

            <div class="sidebar-header">
                <span data-i18n="explorer">EXPLORER</span>
            </div>

            <div id="file-explorer">

                <div class="explorer-section">
                    <span id="workspace-name">DragonIDE</span>
                </div>

                <div id="file-tree"></div>

            </div>
        </aside>


        <main id="main">
            <div id="tabs">

                <div class="tab active">
                    <span data-i18n="welcomeTab">Welcome</span>
                    <span class="tab-close">×</span>
                </div>


            </div>

            <section id="editor">

                <div id="welcome-screen" class="welcome">

                    <h1>DragonFoxIDE</h1>

                    <p data-i18n="welcomeSub">A Powerful IDE built with Rust</p>

                    <div class="welcome-actions">

                        <button id="open-folder-button" data-i18n="openFolder">Open Folder</button>

                        <button id="create-project-button" data-i18n="createProject">Create Project</button>
                    </div>

                </div>

                <div id="editor-container" style="display: none;">
                    <div id="line-numbers"></div>

                    <div id="code-editor-wrapper">
                        <textarea id="code-editor" spellcheck="false" autocomplete="off"
                            autocapitalize="off"></textarea>

                        <pre id="code-highlight"><code id="code-highlight-inner"></code></pre>
                    </div>
                </div>

            </section>

            <section id="bottom-panel">

                <div class="panel-tabs">

                    <button class="panel-tab active" data-i18n="problems">PROBLEMS</button>

                    <button class="panel-tab" data-i18n="output">OUTPUT</button>

                    <button class="panel-tab" data-i18n="terminal">TERMINAL</button>

                </div>

                <div id="panel-content" data-i18n="noProblems">No Problems detected</div>
            </section>

            <footer id="status-right">

                <span>No</span>
                <span>UTF-8</span>
                <span>LF</span>
                <span id="cursor-position">Ln 1, Col 1</span>
            </footer>
        </main>



        <div id="settings-modal" class="modal hidden">

            <div class="modal-backdrop"></div>
            <div class="modal-content">

                <div class="modal-header">
                    <h2 data-i18n="settingsTitle">Settings</h2>
                    <button class="modal-close" id="close-settings">×</button>
                </div>

                <div class="modal-body">

                    <div class="settings-section">
                        <label class="settings-label" data-i18n="theme">Theme</label>
                        <div class="settings-options">
                            <button class="theme-option active" data-theme="dark">Dark</button>
                            <button class="theme-option" data-theme="light">Light</button>
                            <button class="theme-option" data-theme="nord">Nord (blue)</button>
                            <button class="theme-option" data-theme="monokai">Monokai</button>
                            <button class="theme-option" data-theme="glassmorphism">Glass</button>
                        </div>
                    </div>

                    <div class="settings-section">
                        <label class="settings-label" data-i18n="fontSize">Font Size</label>
                        <div class="settings-slider">
                            <input type="range" id="font-size-slider" min="10" max="34" value="14">
                            <span id="font-size-value">14px</span>
                        </div>
                    </div>

                    <div class="settings-section">
                        <label class="settings-label" data-i18n="tabSize">Tab Size</label>
                        <div class="settings-options">
                            <button class="tab-option" data-tab-size="2">2</button>
                            <button class="tab-option active" data-tab-size="4">4</button>
                            <button class="tab-option" data-tab-size="6">6</button>
                            <button class="tab-option" data-tab-size="8">8</button>
                        </div>
                    </div>

                    <div class="settings-section">
                        <label class="settings-label">
                            <input type="checkbox" id="line-wrap-toggle">
                            <span data-i18n="wordWrap">Word Wrap</span>
                        </label>
                    </div>

                    <div class="settings-section">
                        <label class="settings-label" data-i18n="language">Language</label>

                        <div class="settings-options">
                            <button class="lang-option active" data-lang="en">English</button>
                            <button class="lang-option" data-lang="es">Español</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <div id="file-context-menu" class="context-menu hidden">
        <div class="menu-item" id="ctx-new-file" data-i18n="newFile">New File</div>
        <div class="menu-item" id="ctx-new-folder" data-i18n="newFolder">New Folder</div>
        <div class="menu-separator"></div>
        <div class="menu-item" id="ctx-rename" data-i18n="rename">Rename</div>
        <div class="menu-item" id="ctx-delete" data-i18n="delete">Delete</div>
        <div class="menu-separator"></div>
        <div class="menu-item" id="ctx-copy-path" data-i18n="copyPath">Copy Path</div>
    </div>


    <script src="lib/highlight.min.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/main.js"></script>
    <script src="js/titlebar.js"></script>

</body>

</html>
